name: Minimal CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint and Quick Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install lightweight dev tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort pytest -q

      - name: Check code formatting (black)
        run: black --check src/ || true

      - name: Lint (flake8)
        run: flake8 src/ --max-line-length=120 || true

      - name: Import order check (isort)
        run: isort src/ --check-only || true

      - name: Run quick tests (if present)
        run: |
          if [ -d "tests" ]; then pytest -q tests/ || true; else echo "No tests to run"; fi

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Build images only on pushes to main to avoid long runs on PRs
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TFIDF SVC image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/tfidf_svc.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/tfidf-svc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Transformer API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/transformer.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/transformer-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Router image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/router.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy quick scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          format: 'table'

  notify:
    name: Notify Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-images, security]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint/Test: ${{ needs.lint-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Images: ${{ needs.build-images.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY

