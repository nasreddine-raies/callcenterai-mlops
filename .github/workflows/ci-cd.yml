name: CI/CD Pipeline

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:

  # ---------------------------------------------------
  # Lint + Tests
  # ---------------------------------------------------
  lint-and-test:
    name: Lint and Quick Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install lightweight dev tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort pytest -q

      - name: Check code formatting (black)
        run: black --check src/ || true

      - name: Lint (flake8)
        run: flake8 src/ --max-line-length=120 || true

      - name: Import order check (isort)
        run: isort src/ --check-only || true

      - name: Run quick tests (if present)
        run: |
          if [ -d "tests" ]; then pytest -q tests/ || true; else echo "No tests to run"; fi


  # ---------------------------------------------------
  # Build Docker Images Locally (no push)
  # Only on main or develop
  # ---------------------------------------------------
  build-images-local:
    name: Build Docker Images (local)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build TFIDF image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/tfidf_svc.Dockerfile
          load: true
          tags: callcenterai-tfidf:ci

      - name: Save TFIDF image
        run: docker save callcenterai-tfidf:ci -o tfidf_svc_image.tar

      - name: Build Transformer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/transformer.Dockerfile
          load: true
          tags: callcenterai-transformer:ci

      - name: Save Transformer image
        run: docker save callcenterai-transformer:ci -o transformer_image.tar

      - name: Build Router image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/router.Dockerfile
          load: true
          tags: callcenterai-router:ci

      - name: Save Router image
        run: docker save callcenterai-router:ci -o router_image.tar

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/frontend.Dockerfile
          load: true
          tags: callcenterai-frontend:ci

      - name: Save Frontend image
        run: docker save callcenterai-frontend:ci -o frontend_image.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            tfidf_svc_image.tar
            transformer_image.tar
            router_image.tar
            frontend_image.tar


  # ---------------------------------------------------
  # Security Scan
  # ---------------------------------------------------
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-images-local
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy quick scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          format: 'table'


  # ---------------------------------------------------
  # Notify Summary
  # ---------------------------------------------------
  notify:
    name: Notify Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-images-local, security-scan]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint/Test: ${{ needs.lint-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Images: ${{ needs.build-images-local.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
