name: CI-CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =====================================
  # Stage 1: Code Quality & Testing
  # =====================================
  code-quality:
    runs-on: ubuntu-latest
    name: Lint and Test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black flake8 isort

    - name: Black code formatting check
      run: black --check src/ || true

    - name: Flake8 linting
      run: flake8 src/ --max-line-length=120 || true

    - name: isort import order check
      run: isort src/ --check-only || true

    - name: Run unit tests
      run: pytest tests/ -v || true

  # =====================================
  # Stage 2: Build Docker Images
  # =====================================
  build-images:
    runs-on: ubuntu-latest
    needs: code-quality
    name: Build Docker Images
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push TFIDF SVC image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/tfidf_svc.Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tfidf-svc:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tfidf-svc:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Transformer API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/transformer.Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/transformer-api:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/transformer-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Router image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/router.Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/router:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/router:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/frontend.Dockerfile
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # =====================================
  # Stage 3: Security Scanning
  # =====================================
  security:
    runs-on: ubuntu-latest
    needs: build-images
    name: Security Scanning
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # =====================================
  # Stage 4: Notifications
  # =====================================
  notify:
    runs-on: ubuntu-latest
    needs: [code-quality, build-images, security]
    if: always()
    name: Notify Pipeline Status

    steps:
    - name: Determine status
      id: status
      run: |
        if [ "${{ needs.code-quality.result }}" == "failure" ] || \
           [ "${{ needs.build-images.result }}" == "failure" ] || \
           [ "${{ needs.security.result }}" == "failure" ]; then
          echo "status=failed" >> $GITHUB_OUTPUT
        else
          echo "status=success" >> $GITHUB_OUTPUT
        fi

    - name: Print summary
      run: |
        echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Build: ${{ needs.build-images.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scan: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
