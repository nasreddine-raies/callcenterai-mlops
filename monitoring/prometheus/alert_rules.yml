groups:
  - name: ticket_classifier_alerts
    interval: 30s
    rules:
      # Alert if API is down
      - alert: APIDown
        expr: up{job=~"tfidf_svc|transformer_api|router_service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"

      # Alert on high error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }}"

      # Alert on high latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.job }}"
          description: "P95 latency is {{ $value | humanizeDuration }}"

      # Alert on model inference slowness
      - alert: SlowModelInference
        expr: histogram_quantile(0.99, rate(model_inference_duration_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow model inference on {{ $labels.job }}"
          description: "P99 inference time is {{ $value | humanizeDuration }}"
