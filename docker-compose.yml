version: "3.9"

services:
  fastapi:
    build:
      context: .
      dockerfile: ./docker/tfidf_svc.Dockerfile
    container_name: fastapi_service
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlruns/mlflow.db

  mlflow_ui:
    build: 
      context: .
      dockerfile: ./docker/tfidf_svc.Dockerfile
    container_name: mlflow_ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      mlflow ui
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root ./mlruns
      --host 0.0.0.0
      --port 5000
