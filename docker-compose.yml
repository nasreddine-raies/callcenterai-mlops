version: "3.9"

services:

  tfidf_service:
    build:
      context: .
      dockerfile: ./docker/tfidf_svc.Dockerfile
    container_name: tfidf_service
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlruns/mlflow.db

  mlflow_ui:
    build: 
      context: .
      dockerfile: ./docker/tfidf_svc.Dockerfile
    container_name: mlflow_ui
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: >
      mlflow ui
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root ./mlruns
      --host 0.0.0.0
      --port 5000

  transformer_service:
    build: 
      context: .
      dockerfile: ./docker/transformer.Dockerfile
    container_name: transformer_service
    ports:
      - "8002:8000"  # Host:Container - map host 8001 to container 8000
    # Remove the command override, let Dockerfile CMD run

  router_service:
    build:
      context: .
      dockerfile: ./docker/router.Dockerfile
    container_name: router_service
    ports:
      - "9000:8000"
    depends_on:
      - tfidf_service
      - transformer_service
  frontend_ui:
    build:
      context: .
      dockerfile: ./docker/frontend.Dockerfile
    container_name: frontend_ui
    ports:
      - "8501:8501"  # Tu accéderas à l'UI via localhost:8501
    environment:
      # Important : le frontend parle au router via le nom du service Docker (port interne 8000)
      - ROUTER_URL=http://router_service:8000/predict
    depends_on:
      - router_service
    volumes:
      - ./frontend/app.py:/app/app.py